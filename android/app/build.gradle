plugins {
    id 'com.android.application'
}

def defaultServer = (findProperty('midiconDefaultServer') ?: '').toString().trim()
def escapedServer = defaultServer.replace('\\', '\\\\').replace('"', '\\"')
def ciVersionCode = (findProperty('midiconVersionCode') ?: '1').toString().toInteger()
def ciVersionName = (findProperty('midiconVersionName') ?: '1.0.0').toString()

android {
    namespace 'com.nullx.midicon'
    compileSdk 35
    buildToolsVersion '35.0.0'

    defaultConfig {
        applicationId 'com.nullx.midicon'
        minSdk 26
        targetSdk 35
        versionCode ciVersionCode
        versionName ciVersionName
        buildConfigField 'String', 'DEFAULT_SERVER', "\"${escapedServer}\""
    }

    buildFeatures {
        buildConfig true
    }

    buildTypes {
        debug {
            debuggable true
        }
        release {
            minifyEnabled false
            // Release signing is intentionally not configured with a debug key.
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        abortOnError true
    }
}

dependencies {
    testImplementation 'junit:junit:4.13.2'
}
