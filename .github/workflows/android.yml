name: Android APK

on:
  workflow_dispatch:
  push:
    branches: [main, 'arena/**']
    paths:
      - 'android/**'
      - '.github/workflows/android.yml'
  pull_request:
    paths:
      - 'android/**'
      - '.github/workflows/android.yml'

permissions:
  contents: read

concurrency:
  group: android-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-debug-apk:
    name: Build installable debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: android
    env:
      MIDICON_DEFAULT_SERVER: ${{ vars.MIDICON_ANDROID_SERVER }}
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@48b5f213c81028ace310571dc5ec0fbbca0b2947 # v4

      - name: Set up JDK 17
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        with:
          accept-android-sdk-licenses: true
          log-accepted-android-sdk-licenses: false
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@48b5f213c81028ace310571dc5ec0fbbca0b2947 # v4
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - name: Unit test, lint, and assemble debug APK
        run: |
          ./gradlew --no-daemon --stacktrace \
            :app:testDebugUnitTest \
            :app:lintDebug \
            :app:assembleDebug \
            -PmidiconVersionCode="${{ github.run_number }}" \
            -PmidiconVersionName="1.0.0" \
            -PmidiconDefaultServer="$MIDICON_DEFAULT_SERVER"

      - name: Verify APK signature and package metadata
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/debug/app-debug.apk"
          test -f "$APK"
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          BUILD_TOOLS="$(find "$SDK/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)"
          "$BUILD_TOOLS/apksigner" verify --verbose "$APK"
          mkdir -p build/artifacts
          "$BUILD_TOOLS/aapt" dump badging "$APK" > build/artifacts/apk-badging.txt
          cp "$APK" build/artifacts/MIDICon-debug.apk
          (cd build/artifacts && sha256sum MIDICon-debug.apk > SHA256SUMS.txt)
          {
            echo "product=MIDICon Android companion"
            echo "variant=debug"
            echo "versionName=1.0.0"
            echo "versionCode=${{ github.run_number }}"
            echo "commit=${{ github.sha }}"
            echo "run=${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            echo "defaultServer=${MIDICON_DEFAULT_SERVER:-<entered on first launch>}"
            echo "note=Installable debug-signed APK. Requires a reachable HTTPS MIDICon server; transcription is not offline."
          } > build/artifacts/BUILD_INFO.txt

      - name: Upload ready APK
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: MIDICon-debug-apk-${{ github.run_number }}
          path: android/build/artifacts/
          if-no-files-found: error
          retention-days: 30

      - name: Upload Android reports on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: android-reports-${{ github.run_number }}
          path: |
            android/app/build/reports/
            android/app/build/test-results/
          if-no-files-found: ignore
          retention-days: 14
